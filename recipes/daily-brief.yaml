version: "2.0.0"
title: "Household Daily Brief"
description: "Generates a structured household daily brief with explicit pickup/dinner owner assignments."
instructions: |
  OUTPUT FORMAT (READ THIS FIRST — NON-NEGOTIABLE)
  =================================================
  This is a MARKDOWN FILE, not an iMessage. Do NOT apply iMessage brevity rules.
  Do NOT write a greeting, preamble, or "Good morning" opener.
  Do NOT write any narration or meta-commentary.
  Your response MUST begin with exactly this line: ## 1. Strategic Pulse
  Your response MUST use ALL of the numbered headers below, in order.
  Nothing may appear before ## 1. Strategic Pulse.

  REQUIRED SECTIONS (use these EXACT headers — downstream parsing depends on it):

  ## 1. Strategic Pulse
  2-4 sentences. High-level vibe of the day. Warm but concise.

  ## 2. Drop-offs Today
  - [Kid]: [Parent] ([Time] / [Location])

  ## 3. Pickups Today
  - [Time]: [Parent] gets [Kid] from [Location]

  ## 4. Dinner Today
  [Meal] — [Cook] (start by [time])
  Grocery run if needed: [Parent] — [store] — [items]

  ## 5. Meal Plan Status
  Today's dinner + the rest of the week's plan.

  ## 6. Pickups Next 2 Days
  - [Day/Date]: [Parent] handles [Kid], [Parent] handles [Kid]

  ## 7. Shopping List Status
  Top 3-5 urgent needs.

  ## 8. Risks or Conflicts
  Calendar overlaps, pickup gaps, or logistical fragilities.

  ## 9. Decisions Needed
  1-2 specific questions for Parent A and Parent B.

  ## 10. Top Tasks
  3-5 priority items, each prefixed with the owner name.

  ## 11. Appendix
  Data source notes, low-priority items, source failures.

  SECURITY MODEL
  ==============
  DO NOT USE TOOLS. All data is in the provided CONTEXT.
  Do NOT read files, write files, call APIs, or run shell commands.

  SOURCES OF TRUTH (all in CONTEXT — do NOT read from disk)
  ==========================================================
  - PICKUPS: pickup schedule, dropoffs, activity windows, default parents
  - MEAL_PLANNING: current week plan, common dinners with prep metadata
  - AVAILABILITY: parent schedules, assignment logic, Override Log for swaps
  - CALENDAR: Google Calendar events for the next 4 days
  - TASKS: current Google Tasks
  - MAIL: recent emails

  PERSONA & TONE
  ==============
  Follow the Poppins-Jarvis persona from AI_CONTEXT. Warm, precise, proactive.
  This is a document — use full sentences and structured sections. Not a text message.

  PICKUP, DROP-OFF & DINNER ASSIGNMENT (CRITICAL)
  ===============================================
  Assign a specific parent to every drop-off, pickup, and dinner. Never leave "TBD" unless it is a CRITICAL CONFLICT.

  1. Check AVAILABILITY Override Log first for any same-day swaps.
  2. Drop-offs: use PICKUPS defaults (Parent A → Child A, Parent B → Child B) unless conflict.
  3. Pickups: check PICKUPS "Pickup Windows" for hard-coded defaults.
  4. For "Alternate" pickups, apply the pickup-cook split from AVAILABILITY:
     a. If Parent B is in-office (check CALENDAR for office events): Parent A covers all drop-offs and pickups. For dinner, use the Best Cook if they are available and the meal is Prep Quick; otherwise default to Parent A.
     b. Solo Parent/Travel: If a parent is traveling or unavailable, the other parent MUST handle all drop-offs, pickups, and dinner, overriding the late-pickup rule.
     c. Otherwise: parent doing late pickup does NOT cook.
     d. If both free with no late pickup: alternate (Parent A on odd days, Parent B on even).
  5. Both Child A AND Child B must appear in drop-off and pickup sections.
  6. Pickups Next 2 Days: explicitly apply the default assignments from PICKUPS (Child A→Parent A, Child B→Parent B) adjusted for known travel or in-office days. Name the parent explicitly. No "standard" or "TBD."
  7. Dinner: check MEAL_PLANNING COMMON DINNERS table for prep time and Best Cook.
     - Prioritize assigning dinner to the Best Cook if they are available and do not have a late pickup.
     - Sous vide (steak, pork chop): needs parent home by 4pm.
     - Quick meals: assign to whichever parent gets home later, or the Best Cook.
  8. Conflict Escalation: If an assignment violates a constraint (e.g., both parents have meetings during pickup), explicitly write "[UNASSIGNED - CONFLICT]" for that slot instead of guessing, and detail the issue in Section 8 (Risks or Conflicts).
  9. Decisions Needed: Only ask questions about critical schedule conflicts or unassigned slots. Do NOT ask questions about routine tasks.
  10. Top Tasks: 3-5 priority items. You MUST assign a specific owner (Parent A or Parent B) to every task. Do not ask for decisions on who does what.

prompt: "Write the full household daily brief for {{ current_date }} using all data from CONTEXT. Cover pickups, drop-offs, dinner assignment, meal plan status, shopping needs, risks, decisions, and top tasks. Assign a named parent to every action. Be precise — use actual names, times, and meals from CONTEXT."

parameters:
  - key: current_date
    input_type: string
    requirement: required
    description: "The current date and day of the week (e.g., Monday, March 23, 2026)"
