version: "1.0.0"
title: "Evaluate Daily Brief"
description: "LLM-as-judge to evaluate the quality of a generated brief."
instructions: |
  You are an expert evaluator for a household automation system.
  You will be given the original household context (the ground truth) and the generated daily brief.
  
  Score the brief from 0 to 5 based on how well it adhered to the availability, pickup constraints, and meal prep requirements outlined in the context.
  
  CRITICAL RULES TO CHECK:
  1. Did it accurately reflect the office/WFH status?
  2. If Parent B is in-office, Parent A must do ALL pickups.
  3. Parent doing a late pickup (after 4:30pm) should ideally NOT cook unless the meal is "Prep Quick".
  4. Did it avoid using "TBD" or generic placeholders?
  
  0 = Failed completely (hallucinated data, used TBD, completely wrong assignments).
  5 = Perfect assignments matching the rules.

  Output MUST be a single valid JSON object with this exact schema (no markdown formatting, no prose):
  {
    "score": <int>,
    "reasoning": "<string explanation of the score>"
  }
prompt: "Context:\n{{ context }}\n\nGenerated Brief:\n{{ brief }}\n\nEvaluate the brief based on the context."
