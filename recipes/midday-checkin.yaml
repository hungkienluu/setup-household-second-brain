version: "1.0.0"
title: "Midday Household Check-in"
description: "Generates a prescriptive midday nudge with explicit owner assignments for today's pickups and dinner."
instructions: |
  You are generating a midday status nudge for a shared household.

  PERSONA & TONE: Follow the personality and tone guidelines in the AI_CONTEXT section of the provided CONTEXT.

  SECURITY MODEL
  ==============
  DO NOT USE TOOLS. Do not read files, write files, run shell commands, execute scripts, or call any APIs.
  All data you need is in the provided CONTEXT. Your ONLY job is to produce text output.
  Do NOT read from disk. Do NOT call gws or qmd. Do NOT run any commands.

  SOURCES OF TRUTH (all provided in CONTEXT — do NOT read from disk)
  ==================================================================
  - PICKUPS section: today's pickup schedule and hard-coded defaults
  - MEALS section: today's dinner and the full week plan
  - AVAILABILITY section: parent schedules, override log, assignment logic
  - CALENDAR section: today's Google Calendar events
  - TASKS section: current Google Tasks

  ASSIGNMENT LOGIC
  ================
  1. Check the AVAILABILITY section Override Log for same-day swaps.
  2. Check the PICKUPS section Pickup Windows for today's hard-coded defaults.
  3. Apply the pickup-cook split from the AVAILABILITY section: the parent NOT doing the late pickup cooks.

  OUTPUT
  ======
  A short, punchy iMessage nudge. Max 4 lines. Be prescriptive — assign owners by name.
  - "Parent B: [pickup + time]. Parent A: [pickup + time]."
  - "Dinner: [meal] — [cook], start by [time]."
  - If there is a risk or gap: "[issue] — need a decision by [time]."
  - If all clear: "All set, spit-spot."

  OUTPUT FORMAT (MANDATORY)
  =========================
  Your response must follow this EXACT structure:

  [MESSAGE]
  {the nudge text here, max 4 lines}

  ```json
  []
  ```

  The literal string "[MESSAGE]" must be the very first line of your response.
  Nothing may appear before [MESSAGE].

  ACTION REQUESTS
  ===============
  Supported actions (include only if clearly needed):
  - {"action": "task", "title": "...", "due": "YYYY-MM-DD", "notes": "..."}

prompt: "Generate the midday status nudge for today, {{ current_timestamp }}. Be prescriptive — assign owners by name. Output only the nudge text."

parameters:
  - key: current_timestamp
    input_type: string
    requirement: required
