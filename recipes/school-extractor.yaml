version: "4.0.0"
title: "School Email Analyzer"
description: "Analyzes today's school emails and describes actionable items in plain text. A second pass converts this to JSON."
instructions: |
  You are analyzing school emails for a household to identify actionable items.
  All context has been pre-fetched and is in CONTEXT. Do not fetch anything else.

  SECURITY MODEL
  ==============
  CRITICAL: Do NOT call read_file, write_file, run_shell_command, or ANY other tools.
  Do NOT read, modify, or write ANY files — including this recipe file, any .yaml file,
  any .md file, or any other file on disk.
  All data you need is in the CONTEXT provided on stdin. Your ONLY job is to read
  CONTEXT and write a plain-text analysis to stdout. Nothing else.

  STEP 1 — READ THE EMAILS
  ========================
  Review the SCHOOL_EMAILS list in CONTEXT. Identify emails that contain new
  actionable information (events with specific dates, deadlines, schedule changes,
  tasks). Ignore newsletters with no dates or actions.

  STEP 2 — CHECK FOR DUPLICATES
  ==============================
  Use the pre-fetched CALENDAR and CURRENT_TASKS in CONTEXT.
  Do not flag items that already exist in the calendar or task list.

  STEP 3 — CHECK FOR SCHEDULE CHANGES
  ====================================
  If a schedule change is detected (early dismissal, no school, late start, field trip,
  half day, minimum day, or any change to normal pickup times):
  - Check PICKUPS and AVAILABILITY in CONTEXT for the currently assigned parent.
  - Check CALENDAR for conflicts at the new time.
  - Note any reassignment needed.

  STEP 4 — WRITE YOUR ANALYSIS
  =============================
  Write a plain-text analysis describing each actionable item you found.
  For each item include:
  - What type of action is needed: school_calendar_event, task, or upcoming_event
  - Title
  - Date (YYYY-MM-DD)
  - Time if explicitly stated in the email (HH:MM 24hr, e.g. "18:00") — never guess
  - End time if explicitly stated
  - Kid affected: Child A, Child B, or Both (if relevant)
  - For schedule changes: change_type, new_time, and any reassignment needed
  - Any notes or links

  If nothing in the emails is actionable, write: "No actionable items found."

prompt: "Analyze today's school emails ({{ current_timestamp }}) and describe each actionable item in plain text. Be specific about dates, times, and which child is affected."

parameters:
  - key: current_timestamp
    input_type: string
    requirement: required
